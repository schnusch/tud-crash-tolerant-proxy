networks:
  net:
    external: false
    internal: true

services:
  nginx:
    build:
      context: ./empty/
      dockerfile_inline: |
        FROM docker.io/library/nginx:1.30.4-alpine3.24
        RUN ["sed", "-e", "s/\\baccess_log .*$/access_log off;/", "-i", "/etc/nginx/nginx.conf"]
    volumes:
    - type: bind
      source: @nginxFiles@
      target: /usr/share/nginx/html
      read_only: true
    ports:
    - published: @nginxPort@
      target: 80
    networks:
    - net

  haproxy:
    build:
      context: ./empty/
      dockerfile_inline: |
        FROM docker.io/library/haproxy:3.3-alpine3.24
        COPY <<EOF /usr/local/etc/haproxy/haproxy.cfg
        global
            nbthread 1
        listen proxy
            mode tcp
            bind :80
            server nginx nginx.:80
        EOF
    cap_add:
    - NET_BIND_SERVICE
    networks:
    - net
    depends_on:
    - nginx

  random:
    build: &scratch
      context: ./empty/ # The trailing slash resolves symlinks.
      dockerfile_inline: |
        FROM scratch
    volumes:
    - &tmp
      type: tmpfs
      target: /tmp
    - &nix_store
      type: bind
      source: /nix/store
      target: /nix/store
      read_only: true
    init: true
    command: @randomCommand@
    networks:
    - net

  baseline:
    build: *scratch
    volumes:
    - *tmp
    - *nix_store
    init: true
    command: @baselineCommand@
    env_file:
    - ./proxy.env
    ports:
    - published: @baselinePort@
      target: 80
    networks:
    - net
    depends_on:
    - nginx
    - random

  proxy:
    build: *scratch
    volumes:
    - *tmp
    - *nix_store
    init: true
    stop_signal: SIGKILL
    environment:
      PATH: @proxyPath@
    command: @proxyCommand@
    healthcheck: @proxyHealthcheck@
    env_file:
    - ./proxy.env
    ports:
    - published: @proxyPort@
      target: 80
    networks:
    - net
    depends_on:
    - nginx
    - random

  benchmark:
    build: *scratch
    volumes:
    - *nix_store
    - type: bind
      source: ./benchmark/ # The trailing slash resolves symlinks.
      target: /run/benchmark
    init: true
    command: @benchmarkCommand@
    env_file:
    - ./benchmark.env
    networks:
    - net
    depends_on:
    - baseline
    - haproxy
    - proxy
