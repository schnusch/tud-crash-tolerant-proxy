on:
  push: {}
  pull_request: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - run: >-
        sudo apt-get update && sudo apt-get install -y
        build-essential
        libgtest-dev
        pkgconf
        valgrind
    - run: make check
