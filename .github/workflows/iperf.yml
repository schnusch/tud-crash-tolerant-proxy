on:
  push: {}
  pull_request: {}
jobs:
  iperf:
    strategy:
      fail-fast: false
      matrix:
        nix:
        - --nix=package.nix
        - --nix=baseline.nix
        parallel:
        - --parallel=1
        - --parallel=100
    runs-on: ubuntu-latest
    steps:
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - run: nix-shell --run './iperf.py --no-tmux ${{ matrix.nix }} ${{ matrix.parallel }}'
