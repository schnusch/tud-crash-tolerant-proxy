on:
  pull_request: *push
  push: &push
    paths:
    - "thesis/**"
jobs:
  nix_build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: cachix/install-nix-action@v31
    - run: nix build -L ./thesis#default
    - uses: actions/upload-artifact@v4
      with:
        path: result/
