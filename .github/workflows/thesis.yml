on:
  pull_request: &pr
    paths:
    - "thesis/**"
  push: &pr

env:
  cache_key: vegetaPrereqs
  cache_path: /tmp/nix-cache
  nix_copy_from: nix copy --no-check-sigs --from file:///tmp/nix-cache './thesis#default.vegetaPrereqs' || true

jobs:
  build_vegeta_prereqs:
    runs-on: ubuntu-latest
    steps:
    - uses: cachix/install-nix-action@v31
    - uses: actions/cache/restore@v4
      with:
        key: ${{ env.cache_key }}
        path: ${{ env.cache_path }}
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - run: ${{ env.nix_copy_from }}
    - run: nix build -L './thesis#default.vegetaPrereqs'
    - run: nix copy --to file://${{ env.cache_path }} './thesis#default.vegetaPrereqs'
    - uses: actions/cache/save@v4
      with:
        key: ${{ env.cache_key }}
        path: ${{ env.cache_path }}

  nix_build:
    runs-on: ubuntu-latest
    needs:
    - build_vegeta_prereqs
    steps:
    - uses: cachix/install-nix-action@v31
    - uses: actions/cache/restore@v4
      with:
        key: ${{ env.cache_key }}
        path: ${{ env.cache_path }}
    - run: ${{ env.nix_copy_from }}
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - run: >-
        GIT_BUNDLE="tmp/tex/crash-tolerant-proxy-$(git rev-parse --verify --short ${{ github.ref }}).bundle"
        && cd thesis
        && mkdir -p "$(dirname "$GIT_BUNDLE")"
        && git fetch --unshallow
        && git bundle create "$GIT_BUNDLE" ${{ github.ref }}
        && git add --force --intent-to-add "$GIT_BUNDLE"
        && sed -e "/^	tmp\\/tud-crash-tolerant-proxy\\.tar\\.gz\$/ s::	$GIT_BUNDLE:" -i GNUmakefile
    - run: git diff --patch --no-exit-code
    - run: nix build -L ./thesis#default
    - uses: actions/upload-artifact@v4
      with:
        path: result/
